<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="E.A. Detailing - Professionele auto detailing en interieurreiniging.">
<meta name="theme-color" content="#080808">

<title>E.A. Detailing | Professionele Auto Detailing</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #080808;
  color: #fff;
  line-height: 1.6;
}

a {
  color: inherit;
}

.container {
  width: 100%;
  max-width: 1150px;
  margin: auto;
  padding: 0 20px;
}

/* HEADER */

header {
  background: #050505;
  border-bottom: 1px solid #c9a227;
  padding: 22px 20px;
  text-align: center;
}

.logo {
  color: #d4af37;
  font-size: 36px;
  font-weight: 900;
  letter-spacing: 3px;
}

.tagline {
  color: #aaa;
  margin-top: 4px;
  font-size: 14px;
}

/* NAV */

nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(12,12,12,.97);
  border-bottom: 1px solid #222;
  padding: 13px 10px;
  text-align: center;
}

nav a {
  display: inline-block;
  color: #eee;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
  margin: 4px 8px;
}

nav a:hover {
  color: #d4af37;
}

/* HERO */

.hero {
  min-height: 620px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 60px 20px;

  background:
    linear-gradient(
      rgba(0,0,0,.67),
      rgba(0,0,0,.82)
    ),
    url("IMG_9557.jpeg") center/cover no-repeat;
}

.hero-content {
  max-width: 850px;
}

.hero-small {
  color: #d4af37;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 12px;
}

.hero h1 {
  font-size: clamp(40px,7vw,72px);
  line-height: 1.05;
  margin-bottom: 20px;
  text-transform: uppercase;
}

.hero h1 span {
  color: #d4af37;
}

.hero p {
  max-width: 700px;
  margin: 0 auto 30px;
  color: #ddd;
  font-size: 20px;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

.button {
  display: inline-block;
  padding: 14px 24px;
  border-radius: 8px;
  background: #d4af37;
  color: #000;
  text-decoration: none;
  font-weight: 800;
}

.button.dark {
  background: #151515;
  color: #fff;
  border: 1px solid #555;
}

/* SECTIONS */

section {
  padding: 80px 0;
}

.section-title {
  text-align: center;
  margin-bottom: 45px;
}

.section-title h2 {
  color: #d4af37;
  font-size: 36px;
  margin-bottom: 10px;
}

.section-title p {
  color: #999;
  max-width: 650px;
  margin: auto;
}

/* CARDS */

.cards {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 20px;
}

.card {
  background: linear-gradient(145deg,#181818,#101010);
  border: 1px solid #2d2d2d;
  border-radius: 15px;
  padding: 30px 22px;
  text-align: center;
}

.card:hover {
  border-color: #d4af37;
}

.icon {
  font-size: 38px;
  margin-bottom: 15px;
}

.card h3 {
  color: #d4af37;
  margin-bottom: 10px;
}

.card p {
  color: #aaa;
}

#prijzen,
#afspraak {
  background: #0d0d0d;
}

/* PRICES */

.price-card {
  position: relative;
}

.price {
  color: #fff;
  font-size: 28px;
  font-weight: 900;
  margin-top: 18px;
}

.price-card.highlight {
  border: 2px solid #d4af37;
}

.popular {
  position: absolute;
  top: -13px;
  left: 50%;
  transform: translateX(-50%);
  background: #d4af37;
  color: #000;
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
  white-space: nowrap;
}

/* GALLERY */

.gallery {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 18px;
}

.gallery-item {
  overflow: hidden;
  border-radius: 14px;
  border: 1px solid #303030;
  background: #111;
}

.gallery img {
  width: 100%;
  height: 300px;
  display: block;
  object-fit: cover;
}

/* FORM */

.form-box,
.review-box {
  max-width: 800px;
  margin: auto;
  background: #171717;
  border: 1px solid #333;
  border-radius: 18px;
  padding: 35px;
}

.form-intro,
.review-note {
  text-align: center;
  color: #aaa;
  margin-bottom: 28px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.form-group {
  display: flex;
  flex-direction: column;
}

.form-group.full {
  grid-column: 1 / -1;
}

label {
  color: #d4af37;
  font-weight: bold;
  margin-bottom: 7px;
}

input,
select,
textarea {
  width: 100%;
  padding: 14px;
  border: 1px solid #3d3d3d;
  border-radius: 9px;
  background: #0d0d0d;
  color: #fff;
  font-size: 16px;
  outline: none;
}

textarea {
  min-height: 130px;
  resize: vertical;
}

.submit,
.review-button {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  border: none;
  border-radius: 9px;
  background: #d4af37;
  color: #000;
  font-size: 17px;
  font-weight: 900;
  cursor: pointer;
}

/* REVIEWS */

.review-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.review-form textarea {
  min-height: 140px;
}

.review-list {
  margin-top: 45px;
  display: grid;
  gap: 18px;
}

.review-card {
  background: #111;
  border: 1px solid #333;
  border-radius: 14px;
  padding: 22px;
}

.review-card h3 {
  color: #d4af37;
  margin-bottom: 8px;
}

.review-card p {
  color: #ddd;
}

.review-date {
  color: #777;
  font-size: 13px;
  margin-top: 10px;
}

.review-message {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}

/* CONTACT */

.contact-box {
  background:
    linear-gradient(
      rgba(0,0,0,.76),
      rgba(0,0,0,.88)
    ),
    url("IMG_9591.jpeg") center/cover no-repeat;

  border: 1px solid #333;
  border-radius: 20px;
  padding: 55px 25px;
  text-align: center;
}

.contact-box h2 {
  color: #d4af37;
  font-size: 38px;
  margin-bottom: 12px;
}

.contact-box > p {
  color: #bbb;
  margin-bottom: 28px;
}

.contact-info {
  display: flex;
  justify-content: center;
  gap: 35px;
  flex-wrap: wrap;
  margin-bottom: 30px;
}

.contact-item {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.contact-item strong {
  color: #aaa;
  font-size: 13px;
  text-transform: uppercase;
}

.contact-item a {
  color: #d4af37;
  text-decoration: none;
  font-weight: bold;
  font-size: 17px;
}

/* FOOTER */

footer {
  background: #030303;
  border-top: 1px solid #d4af37;
  text-align: center;
  padding: 30px 20px;
  color: #777;
}

.footer-title {
  color: #d4af37;
  font-weight: bold;
  letter-spacing: 2px;
  margin-bottom: 6px;
}

/* WHATSAPP */

.whatsapp {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 999;

  width: 58px;
  height: 58px;

  align-items: center;
