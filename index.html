<section id="review">
  <h2>Laat een review achter</h2>

  <div class="review-box">
    <form action="https://formspree.io/f/JOUW_FORM_ID" method="POST">

      <label for="naam">Naam</label>
      <input
        type="text"
        id="naam"
        name="naam"
        placeholder="Je naam"
        required
      >

      <label for="sterren">Aantal sterren</label>
      <select id="sterren" name="sterren" required>
        <option value="">Kies sterren</option>
        <option value="5">★★★★★</option>
        <option value="4">★★★★☆</option>
        <option value="3">★★★☆☆</option>
        <option value="2">★★☆☆☆</option>
        <option value="1">★☆☆☆☆</option>
      </select>

      <label for="review">Je review</label>
      <textarea
        id="review"
        name="review"
        rows="5"
        placeholder="Schrijf hier je ervaring..."
        required
      ></textarea>

      <button type="submit">
        Review versturen
      </button>

    </form>
  </div>
</section>
